<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Essensplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2F6BFF; --blue-d:#1F4FD1; --blue-l:#E4EDFF; --blue-ll:#F1F5FF;
  --rosa:#F9DDE8; --rosa-l:#FDF0F5; --rosa-d:#C95683;
  --ink:#1B2233; --ink2:#5B6478; --ink3:#9AA2B3; --line:#E5E9F2;
  --bg:#F5F7FC; --bg0:rgba(245,247,252,0); --bg85:rgba(245,247,252,.85); --ok:#22A06B;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --glass: rgba(255,255,255,.88); --card:#fff; --card2:#fff; --shadow:rgba(27,34,51,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
.fa{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-0.125em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Hintergrund: weiche Formen über die ganze Seite */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;display:block}
.blobs .b1{width:42vw;max-width:220px;aspect-ratio:1.25;right:5vw;top:calc(var(--top) + 6px);background:var(--rosa);opacity:.75;border-radius:58% 42% 61% 39% / 47% 58% 42% 53%}
.blobs .b2{width:34vw;max-width:180px;aspect-ratio:1.1;left:4vw;top:34%;background:var(--blue-l);opacity:.9;border-radius:43% 57% 38% 62% / 56% 41% 59% 44%}
.blobs .b3{width:46vw;max-width:240px;aspect-ratio:1.15;right:6vw;top:58%;background:var(--rosa);opacity:.55;border-radius:62% 38% 54% 46% / 41% 57% 43% 59%}
.blobs .b4{width:30vw;max-width:160px;aspect-ratio:1;left:10vw;bottom:calc(var(--bot) + 120px);background:var(--blue-l);opacity:.8;border-radius:39% 61% 44% 56% / 58% 42% 58% 42%}
body[data-tab=list] .blobs .b1{background:var(--blue-l)} body[data-tab=list] .blobs .b2{background:var(--rosa)}

header{position:sticky;top:0;z-index:5;padding:calc(var(--top) + 14px) 18px 12px;background:linear-gradient(var(--bg) 78%,var(--bg0))}
.hrow{display:flex;align-items:center;gap:12px}
#art{width:48px;height:48px;flex:none}
#art svg{width:100%;height:100%;display:block}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.025em;flex:1}
.status{font-size:12px;color:var(--ink3)}
main{padding:2px 14px calc(var(--bot) + 140px);max-width:760px;margin:0 auto}

/* Leiste unten mit Unschärfe dahinter */
.tabfade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bot) + 118px);z-index:19;pointer-events:none;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:linear-gradient(var(--bg0),var(--bg85) 45%);
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 14px);z-index:20;display:flex;align-items:flex-end;gap:4px;background:var(--card);border-radius:999px;padding:6px 10px;box-shadow:0 10px 34px rgba(27,34,51,.16)}
.tabs button{border:0;background:none;cursor:pointer;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;min-width:84px}
.tabs button .fa{font-size:19px}
.tabs button.on{color:var(--blue)}
.tabs .mid{margin-top:-30px}
.tabs .mid .bub{border-color:var(--card)!important;width:62px;height:62px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;background:linear-gradient(135deg,#2F6BFF,#7B6BFF 60%,#FF7FB0);border-radius:52% 48% 50% 50% / 50% 52% 48% 50%;box-shadow:0 8px 22px rgba(47,107,255,.35);border:4px solid #fff}
.tabs .mid .fa{font-size:24px}
.tabs .mid{color:var(--ink2)} .tabs .mid.on{color:var(--blue)}
.tabs .mid:not(.on) .bub{background:linear-gradient(135deg,#8FB0FF,#F7B5CF)}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:var(--blue-l);color:var(--blue-d)}
.btn.r{background:var(--rosa);color:#8A3E5C}
.btn.g{background:none;color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:#FDECEC;color:#C43D3D}
.btn:disabled{opacity:.5}
.ib{border:0;width:40px;height:40px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);box-shadow:0 1px 4px rgba(27,34,51,.08);flex:none}
.ib.p{background:var(--blue);color:#fff}
.ib.big{width:48px;height:48px;font-size:18px}
.ib.sm{width:34px;height:34px;font-size:14px}
.ib.ghost{box-shadow:none;background:none}
.note{background:var(--rosa-l);color:#8A3E5C;border-radius:999px;padding:10px 16px;font-size:14px;margin:10px 0}
.emptybig{text-align:center;color:var(--ink3);padding:40px 20px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}

/* Essenswoche */
.calbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.calbar .ttl{flex:1;font-weight:700;font-size:17px;text-align:center}
.seg{display:flex;background:var(--glass);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 4px rgba(27,34,51,.06)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.week{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.day{background:var(--glass);padding:10px 10px 10px 10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 12px rgba(27,34,51,.05);border-radius:999px;cursor:pointer}
.day.today{background:var(--card);box-shadow:0 0 0 2px var(--blue),0 6px 18px rgba(47,107,255,.14)}
.dlabel{width:54px;height:54px;flex:none;text-align:center;display:flex;flex-direction:column;justify-content:center;background:var(--blue-ll);border-radius:50%}
.day:nth-child(3n+2) .dlabel{background:var(--rosa-l)}
.dlabel .wd{font-size:11px;line-height:1;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.dlabel .dn{font-size:20px;font-weight:800;line-height:1.15}
.day.today .dlabel{background:var(--blue);color:#fff}.day.today .dlabel .wd{color:rgba(255,255,255,.8)}
.dishes{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{background:var(--blue-ll);border-radius:999px;padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.free{background:var(--rosa-l)}
.chip .t{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .m{font-size:12px;color:var(--ink2);background:var(--card);border-radius:999px;padding:2px 8px}
.empty{color:var(--ink3);font-size:14px;padding-left:2px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
.mh{font-size:11px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
.mc{background:var(--glass);border-radius:22px;min-height:78px;padding:6px 4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px}
.mc.out{opacity:.4}
.mc .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.mc.has .n{background:var(--blue-ll)}
.mc.today{box-shadow:inset 0 0 0 2px var(--blue)}
.mc.today .n{background:var(--blue);color:#fff}
.mc .d{width:100%;font-size:10px;line-height:1.25;background:var(--blue-ll);border-radius:999px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mc .more{font-size:10px;color:var(--ink3)}

/* Einkaufsliste */
.addbar{display:flex;gap:8px;position:relative;align-items:center}
.field{flex:1;border:0;background:var(--card);border-radius:999px;padding:13px 18px;box-shadow:0 2px 10px rgba(27,34,51,.07);outline:none;min-width:0}
.field:focus{box-shadow:0 0 0 2px var(--blue)}
.sugg{position:absolute;z-index:50;background:var(--card);border-radius:26px;box-shadow:0 10px 30px rgba(27,34,51,.16);padding:6px;display:none;max-height:260px;overflow:auto}
.sugg button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:999px;cursor:pointer}
.sugg button:hover,.sugg button.hl{background:var(--blue-ll)}
.group{background:var(--cbg,var(--glass));border-radius:34px 28px 32px 26px / 28px 34px 26px 32px;padding:12px 8px 6px;margin-top:14px;box-shadow:0 2px 12px rgba(27,34,51,.04)}
.group:nth-of-type(2n){border-radius:28px 34px 26px 32px / 32px 26px 34px 28px}
.group.done{opacity:.85}
.cat{font-size:12px;font-weight:700;color:var(--cfg,var(--ink3));text-transform:uppercase;letter-spacing:.05em;margin:2px 10px 8px}
.item{background:var(--card);border-radius:999px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:10px;position:relative;z-index:1;transition:transform .2s;user-select:none;-webkit-user-select:none}
.cb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);color:transparent;font-size:13px}
.cb:hover{color:var(--line)}
.item.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .nm{font-weight:600}
.item .qty{color:var(--ink2);font-weight:500}
.item.done .nm{text-decoration:line-through;color:var(--ink3)}
.item .sub{font-size:13px;color:var(--ink2);margin-top:1px}

/* Rezepte */
.reclist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--card);padding:10px 10px 10px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 12px rgba(27,34,51,.05);border-radius:999px}
.rcard .t{font-weight:700}
.rcard .s{font-size:13px;color:var(--ink3)}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(20,26,40,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:40px 34px 0 0 / 34px 40px 0 0;padding:18px 16px calc(var(--bot) + 24px);-webkit-overflow-scrolling:touch}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:40px 32px 38px 30px / 32px 40px 30px 38px;max-height:88vh}}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.shead h2{flex:1;margin:0;font-size:20px;font-weight:800}
.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin:16px 6px 6px;display:block}
.row.lbl{display:flex}
.inp{width:100%;border:0;background:var(--card);border-radius:999px;padding:12px 16px;outline:none;box-shadow:0 1px 4px rgba(27,34,51,.08)}
textarea.inp{border-radius:24px;min-height:90px;resize:vertical}
.inp:focus{box-shadow:0 0 0 2px var(--blue)}
.ing{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ing .n{flex:1.6}.ing .a{flex:1}
.ing .inp{padding:10px 14px}
.planned{display:flex;flex-direction:column;gap:6px}
.imp{background:var(--rosa-l);border-radius:38px 30px 34px 28px / 30px 38px 28px 34px;padding:16px 16px 16px 18px;margin-top:14px}
.imp h3{margin:0 0 10px 4px;font-size:15px;font-weight:700;color:#8A3E5C}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files span{font-size:12px;background:var(--card);border-radius:999px;padding:5px 12px}
.prog{font-size:13px;color:var(--blue-d);margin-top:8px;display:flex;gap:8px;align-items:center}
.bar{height:6px;border-radius:999px;background:var(--card);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.steps .st{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.steps .st .k,.stepview .k{width:28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:8px}
.ingview{background:var(--card);border-radius:30px 24px 28px 22px / 24px 30px 22px 28px;padding:8px 18px}
.ingview div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.ingview div:last-child{border-bottom:0}
.ingview .a{color:var(--ink2)}
.stepview div{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.stepview div span:last-child{padding-top:11px}
.stepview .k{margin-top:5px}
.link{color:var(--blue);word-break:break-all;padding:0 6px;display:block}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 108px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;border:0;font-size:14px}
.av.big{width:38px;height:38px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(27,34,51,.15)}
.welcome{display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:10px 6px 4px}
.welcome>svg{width:84px;height:84px;margin:6px auto 6px}
.welcome h2{margin:6px 0 4px;font-size:24px;font-weight:800}
.welcome .inp{margin-top:14px}
.muted{color:var(--ink3);font-size:14px}
.or{color:var(--ink3);font-size:13px;margin:16px 0 8px}
.who{display:flex;flex-direction:column;gap:8px;margin:16px 0 6px}
.whob{border:0;background:var(--card);border-radius:999px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(27,34,51,.08)}
.whob .av{width:40px;height:40px;font-size:17px}
.codebox{flex:1;background:var(--card);border-radius:999px;padding:12px 16px;font-weight:800;letter-spacing:.2em;text-align:center;font-size:18px}

/* Dunkelmodus */
html.dark{--blue:#5B8CFF;--blue-d:#9DB8FF;--blue-l:#22304F;--blue-ll:#1B2438;--rosa:#4A2636;--rosa-l:#2E1F27;--rosa-d:#F08DB3;--ink:#E8ECF5;--ink2:#B1B8C9;--ink3:#7D8597;--line:#2C3344;--bg:#12151D;--bg0:rgba(18,21,29,0);--bg85:rgba(18,21,29,.85);--glass:rgba(30,35,48,.9);--card:#1E2330;--card2:#262C3B;--shadow:rgba(0,0,0,.3)}
html.dark .btn.r{color:#F7C1D6}
html.dark .toast{background:#E8ECF5;color:#12151D}
html.dark .note{color:#F7C1D6}
html.dark .imp h3{color:#F7C1D6}
html.dark .group{--cbg:var(--glass)}
html.dark .blobs i{opacity:.35}
html.dark .chip .m{background:var(--card2)}
/* Wischen auf der Einkaufsliste */
.swipe{position:relative;margin-bottom:6px;border-radius:999px;overflow:hidden}
.swacts{opacity:0;transition:opacity .15s;position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;gap:0;border-radius:999px;overflow:hidden}
.sw{border:0;font-weight:700;font-size:14px;color:#fff;width:88px;cursor:pointer;transition:width .15s}
.sw.amt{background:var(--blue)}
.sw.del{background:#E05A5A;border-radius:0 999px 999px 0}
.swipe.swiping .swacts{opacity:1}
.swipe.far .sw.amt{width:0;padding:0;overflow:hidden}
.swipe.far .sw.del{width:100%}
.swipe.gone{transition:opacity .18s;opacity:0}
.note-line{display:flex;align-items:center;gap:4px;color:var(--rosa-d);font-size:13px;line-height:1.35}
.note-line b{font-weight:600}
.nx{border:0;background:none;color:var(--ink3);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex:none}
.emptyart{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink3);font-weight:600;padding:36px 20px}
.emptyart svg{width:130px;height:98px}
.greytxt{color:var(--ink3);font-size:14px;padding:4px 8px;line-height:1.45}
/* Rezepte */
.tiles{display:flex;gap:10px;overflow-x:auto;margin:14px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;border:0;color:#fff;font-weight:800;font-size:15px;width:150px;height:76px;border-radius:22px;padding:12px 14px;text-align:left;display:flex;align-items:flex-end;cursor:pointer;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:58% 42% 61% 39% / 47% 58% 42% 53%;background:rgba(255,255,255,.22)}
.tile.on{outline:3px solid var(--ink);outline-offset:2px}
.thumb{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--blue-d);background:var(--blue-l)}
.thumb.ph.c1{background:var(--rosa);color:var(--rosa-d)}.thumb.ph.c2{background:#E6F4E8;color:#2F8A4A}
.heart{color:var(--ink3)}.heart.on{color:#F06AA0}
.pill{font-size:13px;font-weight:600;background:var(--blue-ll);color:var(--blue-d);border-radius:999px;padding:5px 12px}
.pill.t{background:var(--rosa-l);color:var(--rosa-d)}
.banner{margin:-4px 0 12px}
.banner img{width:100%;max-height:260px;object-fit:cover;border-radius:40px 32px 38px 30px / 32px 40px 30px 38px;display:block}
.nutri{background:var(--card);border-radius:30px 24px 28px 22px / 24px 30px 22px 28px;padding:12px 18px;margin-top:10px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.nutri b{color:var(--ink)}
.nutri .greytxt{padding:2px 0 0;font-size:13px}
.chip .kc{font-size:12px;color:var(--ink2);white-space:nowrap}
.ingwrap{margin-bottom:6px}
.ingwrap .ing{margin-bottom:0}
.prodline{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--blue-d);margin:2px 0 0 16px}
.inp.need{background:var(--rosa-l);box-shadow:0 0 0 2px var(--rosa)}
.neednote{color:var(--rosa-d);font-size:13px;margin:-2px 6px 8px}
.stepper{display:flex;align-items:center;gap:12px;margin-left:4px}
.stepper .ib{font-size:18px;font-weight:700}
.servn{font-size:22px;font-weight:800;min-width:28px;text-align:center}
.tagbox{display:flex;flex-wrap:wrap;gap:6px}
.tagb{border:0;background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px var(--shadow)}
.tagb.on{background:var(--blue);color:#fff}
.photoprev{display:flex;align-items:center;gap:12px}
.photoprev img,.photoprev .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none}
.photoprev .ph{background:var(--blue-ll);color:var(--ink3);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center}
.checks{display:flex;flex-direction:column;gap:6px}
.check{border:0;background:var(--card);border-radius:999px;padding:10px 14px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-weight:600}
.check .box{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;flex:none}
.check.on .box{background:var(--blue);border-color:var(--blue);color:#fff}
.pick button{display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
/* Kochmodus */
.cook{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--top) + 14px) 18px calc(var(--bot) + 18px)}
.chead{display:flex;align-items:center;gap:8px}
.ctitle{flex:1;font-weight:800;font-size:18px}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;overflow:auto}
.cnum{color:var(--ink3);font-weight:700;font-size:14px}
.cstep{font-size:clamp(22px,6vw,32px);font-weight:600;line-height:1.35}
.ctimers{display:flex;flex-wrap:wrap;gap:8px}
.cings{max-height:40vh;overflow:auto;margin-top:10px}
.crun{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tm{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:8px 10px 8px 16px}
.tm span{flex:1;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b{font-size:20px;font-variant-numeric:tabular-nums}
.tm.ring{background:var(--rosa);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.cnav{display:flex;gap:10px}.cnav .btn{flex:1;padding:16px}
/* Nährstoff-Bericht */
.rep{background:var(--card);border-radius:28px 22px 26px 20px / 22px 28px 20px 26px;padding:12px 16px;margin-bottom:8px}
.rhead{display:flex;justify-content:space-between;font-size:15px}
.rhead span{color:var(--ink2);font-weight:600}
.rbar{height:8px;border-radius:999px;background:var(--blue-ll);overflow:hidden;margin:8px 0 4px}
.rbar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.rep.low .rbar i{background:var(--rosa-d)}
.rep.good .rbar i{background:var(--ok)}
.rep.high .rbar i{background:#E8892E}
.rsub{font-size:13px;color:var(--ink3);margin-top:2px}
.rsug{font-size:14px;margin-top:6px}
.rsug span{color:var(--rosa-d);font-weight:700}

/* Vorschläge als Chips */
.schips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 2px}
.schip{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px var(--shadow)}
.schip.hl,.schip:active{background:var(--blue);color:#fff}
.ingwrap .schips{margin:6px 0 2px}
/* Einkaufsliste ohne Kategorie-Kästen */
.flatlist{margin-top:14px}
.flatlist .swipe.gap{margin-top:14px}
.item{background:color-mix(in srgb, var(--cfg, #8891A5) 13%, var(--card))}
.item .cb{border-color:color-mix(in srgb, var(--cfg, #8891A5) 45%, var(--card))}
.donebox{margin-top:22px}
.donebox .item{background:var(--card)}
.donebox .item .body{opacity:.6}
/* Rezept-Kategorien als Raster */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0;padding:0;overflow:visible;position:relative;z-index:1}
.tile{width:auto;height:64px;border-radius:18px;font-size:15px;padding:10px 14px;touch-action:manipulation}
.tile span{position:relative;z-index:1;pointer-events:none}
.tile::after{pointer-events:none}
.tile{justify-content:space-between}
.tcount{position:relative;z-index:1;font-size:13px;font-weight:700;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 9px;align-self:flex-end}
.rechead{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 0;font-size:18px}
.gearb{font-size:17px}

/* Mehr Luft */
main{padding:6px 18px calc(var(--bot) + 150px)}
header{padding:calc(var(--top) + 16px) 20px 14px}
.calbar{margin:4px 0 16px}
.week{gap:14px}
.day{padding:12px 14px 12px 12px;gap:14px}
.dishes{gap:8px}
.chip{padding:10px 16px}
.month{gap:8px}
.mc{min-height:84px}
.swipe{margin-bottom:10px}
.item{padding:12px 14px 12px 12px;gap:12px}
.flatlist{margin-top:18px}
.flatlist .swipe.gap{margin-top:20px}
.note-line{margin-top:2px}
.reclist{gap:12px;margin-top:18px}
.tiles{gap:12px;margin-top:18px}
.rcard{padding:12px 14px 12px 12px}
.lbl{margin:20px 6px 8px}
.actions{margin-top:22px;gap:10px}
.ing{gap:8px}
.ingwrap{margin-bottom:10px}

/* Einstellungen */
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;margin:-4px 0 18px;text-align:center}
.profblob{width:96px;height:96px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:800;background:linear-gradient(140deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#FF8DBA));border-radius:56% 44% 52% 48% / 46% 54% 46% 54%;box-shadow:0 10px 28px color-mix(in srgb,var(--pc) 35%,transparent)}
.profname{font-size:22px;font-weight:800;margin-top:6px}
.setcard{background:var(--card);padding:18px 18px 18px;margin-bottom:14px;box-shadow:0 2px 12px var(--shadow)}
.setcard.a{border-radius:36px 28px 34px 26px / 28px 36px 26px 34px}
.setcard.b{border-radius:28px 36px 26px 34px / 36px 28px 34px 26px}
.settitle{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:12px}
.seg.wide{display:flex;width:100%;background:var(--blue-ll);box-shadow:none}
.seg.wide button{flex:1;padding:10px 0;font-size:15px}
.members{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.mem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.mem .av{width:44px;height:44px;font-size:18px}
.codebox.big{background:var(--blue-ll);font-size:24px;padding:14px;margin-bottom:12px;border-radius:999px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setfoot{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-top:8px}
.hidden{display:none!important}
</style>
</head>
