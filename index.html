<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<title>Essensplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2F6BFF; --blue-d:#1F4FD1; --grad:linear-gradient(135deg,#3E6BFF,#7B5CFF); --blue-l:#E4EDFF; --blue-ll:#F1F5FF;
  --rosa:#F9DDE8; --rosa-l:#FDF0F5; --rosa-d:#C95683;
  --ink:#1B2233; --ink2:#5B6478; --ink3:#9AA2B3; --line:#E5E9F2;
  --bg:#F5F7FC; --bg0:rgba(245,247,252,0); --bg85:rgba(245,247,252,.85); --ok:#22A06B;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --glass: rgba(255,255,255,.88); --card:#fff; --card2:#fff; --shadow:rgba(27,34,51,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
.fa{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-0.125em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Hintergrund: weiche Formen über die ganze Seite */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;display:block}
.blobs .b3,.blobs .b4{display:none}
.blobs{--bw:min(74vw,440px);--bh:calc(var(--bw) / 1.1)}
.blobs i{width:var(--bw);height:var(--bh);transition:left .6s cubic-bezier(.3,.9,.3,1.08),top .6s cubic-bezier(.3,.9,.3,1.08),border-radius .6s ease,background-color .5s ease,opacity .5s ease}
/* Essenswoche: oben rechts und unten links, jeweils vom Rand angeschnitten */
.blobs .b1{left:calc(100% - var(--bw) * .54);top:16%;background:var(--rosa);opacity:.55;border-radius:58% 42% 61% 39% / 47% 58% 42% 53%}
.blobs .b2{left:calc(var(--bw) * -.49);top:calc(100% - var(--bot) - 6% - var(--bh));background:var(--blue-l);opacity:.8;border-radius:43% 57% 38% 62% / 56% 41% 59% 44%}
/* Einkaufsliste: gespiegelt */
body[data-tab=list] .blobs .b1{left:calc(var(--bw) * -.49);top:24%;background:var(--blue-l);opacity:.8;border-radius:41% 59% 47% 53% / 60% 44% 56% 40%}
body[data-tab=list] .blobs .b2{left:calc(100% - var(--bw) * .54);top:calc(100% - var(--bot) - 4% - var(--bh));background:var(--rosa);opacity:.55;border-radius:62% 38% 55% 45% / 42% 57% 43% 58%}
/* Rezepte: beide unterhalb der Kategorien */
body[data-tab=rec] .blobs .b1{left:calc(var(--bw) * -.51);top:calc(100% - var(--bot) - 30% - var(--bh));background:var(--blue-l);opacity:.8;border-radius:52% 48% 40% 60% / 45% 60% 40% 55%}
body[data-tab=rec] .blobs .b2{left:calc(100% - var(--bw) * .51);top:calc(100% - var(--bot) + 4% - var(--bh));background:var(--rosa);opacity:.55;border-radius:47% 53% 63% 37% / 55% 45% 55% 45%}

header{position:sticky;top:0;z-index:5;padding:calc(var(--top) + 14px) 18px 12px;background:linear-gradient(var(--bg) 78%,var(--bg0))}
.hrow{display:flex;align-items:center;gap:12px}
:is(#art,[data-cid=art]){width:48px;height:48px;flex:none}
:is(#art,[data-cid=art]) svg{width:100%;height:100%;display:block}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.025em;flex:1}
.status{font-size:12px;color:var(--ink3)}
main{padding:2px 14px calc(var(--bot) + 140px);max-width:760px;margin:0 auto}

/* Leiste unten mit Unschärfe dahinter */
.tabfade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bot) + 118px);z-index:19;pointer-events:none;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:linear-gradient(var(--bg0),var(--bg85) 45%);
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 14px);z-index:20;display:flex;align-items:flex-end;gap:4px;background:var(--card);border-radius:999px;padding:6px 10px;box-shadow:0 10px 34px rgba(27,34,51,.16)}
.tabs button{border:0;background:none;cursor:pointer;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;min-width:84px}
.tabs button .fa{font-size:19px}
.tabs button.on{color:var(--blue)}
.tabs .mid{margin-top:-30px}
.tabs .mid .bub{border-color:var(--card)!important;width:62px;height:62px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;background:linear-gradient(135deg,#2F6BFF,#7B6BFF 60%,#FF7FB0);border-radius:52% 48% 50% 50% / 50% 52% 48% 50%;box-shadow:0 8px 22px rgba(47,107,255,.35);border:4px solid #fff}
.tabs .mid .fa{font-size:24px}
.tabs .mid{color:var(--ink2)} .tabs .mid.on{color:var(--blue)}
.tabs .mid:not(.on) .bub{background:linear-gradient(135deg,#8FB0FF,#F7B5CF)}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:var(--blue-l);color:var(--blue-d)}
.btn.r{background:color-mix(in srgb,#7B5CFF 13%,var(--card));color:#4F45D0}
.btn.g{background:none;color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:#FDECEC;color:#C43D3D}
.btn:disabled{opacity:.5}
.ib{border:0;width:40px;height:40px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);box-shadow:0 1px 4px rgba(27,34,51,.08);flex:none}
.ib.p{background:var(--blue);color:#fff}
.ib.big{width:48px;height:48px;font-size:18px}
.ib.sm{width:34px;height:34px;font-size:14px}
.ib.ghost{box-shadow:none;background:none}
.note{background:var(--rosa);opacity:.55;color:#8A3E5C;border-radius:999px;padding:10px 16px;font-size:14px;margin:10px 0}
.emptybig{text-align:center;color:var(--ink3);padding:40px 20px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}

/* Essenswoche */
.calbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.calbar .ttl{flex:1;font-weight:700;font-size:17px;text-align:center}
.seg{display:flex;background:var(--glass);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 4px rgba(27,34,51,.06)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.week{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.day{background:var(--glass);padding:10px 10px 10px 10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 12px rgba(27,34,51,.05);border-radius:999px;cursor:pointer}
.day.today{background:var(--card);box-shadow:0 0 0 2px var(--blue),0 6px 18px rgba(47,107,255,.14)}
.dlabel{width:54px;height:54px;flex:none;text-align:center;display:flex;flex-direction:column;justify-content:center;background:var(--blue-l);opacity:.8;border-radius:50%}
.dlabel .wd{font-size:12px;line-height:1;font-weight:700;color:var(--ink3)}
.dlabel .dn{font-size:20px;font-weight:800;line-height:1.15}
.day.today .dlabel{background:var(--blue);color:#fff}.day.today .dlabel .wd{color:rgba(255,255,255,.8)}
.dishes{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{background:var(--blue-l);opacity:.8;border-radius:999px;padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.free{background:var(--rosa);opacity:.55}
.chip .t{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .m{font-size:12px;color:var(--ink2);background:var(--card);border-radius:999px;padding:2px 8px}
.empty{color:var(--ink3);font-size:14px;padding-left:2px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
.mh{font-size:11px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
.mc{background:var(--glass);border-radius:22px;min-height:78px;padding:6px 4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px}
.mc.out{opacity:.4}
.mc .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.mc.has .n{background:var(--blue-l);opacity:.8}
.mc.today{box-shadow:inset 0 0 0 2px var(--blue)}
.mc.today .n{background:var(--blue);color:#fff}
.mc .d{width:100%;font-size:10px;line-height:1.25;background:var(--blue-l);opacity:.8;border-radius:999px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mc .more{font-size:10px;color:var(--ink3)}

/* Einkaufsliste */
.addbar{display:flex;gap:8px;position:relative;align-items:center}
.field{flex:1;border:0;background:var(--card);border-radius:999px;padding:13px 18px;box-shadow:0 2px 10px rgba(27,34,51,.07);outline:none;min-width:0}
.field:focus{box-shadow:0 0 0 2px var(--blue)}
.sugg{position:absolute;z-index:50;background:var(--card);border-radius:26px;box-shadow:0 10px 30px rgba(27,34,51,.16);padding:6px;display:none;max-height:260px;overflow:auto}
.sugg button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:999px;cursor:pointer}
.sugg button:hover,.sugg button.hl{background:var(--blue-l);opacity:.8}
.group{background:var(--cbg,var(--glass));border-radius:34px 28px 32px 26px / 28px 34px 26px 32px;padding:12px 8px 6px;margin-top:14px;box-shadow:0 2px 12px rgba(27,34,51,.04)}
.group:nth-of-type(2n){border-radius:28px 34px 26px 32px / 32px 26px 34px 28px}
.group.done{opacity:.85}
.cat{font-size:15px;font-weight:700;color:var(--ink2);margin:2px 10px 8px}
.item{background:var(--card);border-radius:999px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:10px;position:relative;z-index:1;transition:transform .2s;user-select:none;-webkit-user-select:none}
.cb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);color:transparent;font-size:13px}
.cb:hover{color:var(--line)}
.item.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .nm{font-weight:600}
.item .qty{color:var(--ink2);font-weight:500}
.item.done .nm{text-decoration:line-through;color:var(--ink3)}
.item .sub{font-size:13px;color:var(--ink2);margin-top:1px}

/* Rezepte */
.reclist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--card);padding:10px 10px 10px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 12px rgba(27,34,51,.05);border-radius:999px}
.rcard .t{font-weight:700}
.rcard .s{font-size:13px;color:var(--ink3)}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(20,26,40,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:40px 34px 0 0 / 34px 40px 0 0;padding:18px 16px calc(var(--bot) + 24px);-webkit-overflow-scrolling:touch}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:40px 32px 38px 30px / 32px 40px 30px 38px;max-height:88vh}}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.shead h2{flex:1;margin:0;font-size:20px;font-weight:800}
.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin:16px 6px 6px;display:block}
.row.lbl{display:flex}
.inp{width:100%;border:0;background:var(--card);border-radius:999px;padding:12px 16px;outline:none;box-shadow:0 1px 4px rgba(27,34,51,.08)}
textarea.inp{border-radius:24px;min-height:90px;resize:vertical}
.inp:focus{box-shadow:0 0 0 2px var(--blue)}
.ing{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ing .n{flex:1.6}.ing .a{flex:1}
.ing .inp{padding:10px 14px}
.planned{display:flex;flex-direction:column;gap:6px}
.imp{background:linear-gradient(135deg,color-mix(in srgb,#5B7FFF 10%,var(--card)),color-mix(in srgb,#B06BFF 12%,var(--card)));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#7B5CFF 18%,transparent);border-radius:38px 30px 34px 28px / 30px 38px 28px 34px;padding:16px 16px 16px 18px;margin-top:14px}
.imp h3{margin:0 0 10px 4px;font-size:15px;font-weight:700;color:#4F45D0}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files span{font-size:12px;background:var(--card);border-radius:999px;padding:5px 12px}
.prog{font-size:13px;color:var(--blue-d);margin-top:8px;display:flex;gap:8px;align-items:center}
.bar{height:6px;border-radius:999px;background:var(--card);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.steps .st{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.steps .st .k,.stepview .k{width:28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:8px}
.ingview{background:var(--card);border-radius:30px 24px 28px 22px / 24px 30px 22px 28px;padding:8px 18px}
.ingview div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.ingview div:last-child{border-bottom:0}
.ingview .a{color:var(--ink2)}
.stepview div{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.stepview div span:last-child{padding-top:11px}
.stepview .k{margin-top:5px}
.link{color:var(--blue);word-break:break-all;padding:0 6px;display:block}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 108px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;border:0;font-size:14px}
.av.big{width:38px;height:38px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(27,34,51,.15)}
.welcome{display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:10px 6px 4px}
.welcome>svg{width:84px;height:84px;margin:6px auto 6px}
.welcome h2{margin:6px 0 4px;font-size:24px;font-weight:800}
.welcome .inp{margin-top:14px}
.muted{color:var(--ink3);font-size:14px}
.or{color:var(--ink3);font-size:13px;margin:16px 0 8px}
.who{display:flex;flex-direction:column;gap:8px;margin:16px 0 6px}
.whob{border:0;background:var(--card);border-radius:999px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 1px 4px rgba(27,34,51,.08)}
.whob .av{width:40px;height:40px;font-size:17px}
.codebox{flex:1;background:var(--card);border-radius:999px;padding:12px 16px;font-weight:800;letter-spacing:.2em;text-align:center;font-size:18px}

/* Dunkelmodus */
html.dark{--blue:#5B8CFF;--blue-d:#9DB8FF;--blue-l:#22304F;--blue-ll:#1B2438;--rosa:#4A2636;--rosa-l:#2E1F27;--rosa-d:#F08DB3;--ink:#E8ECF5;--ink2:#B1B8C9;--ink3:#7D8597;--line:#2C3344;--bg:#12151D;--bg0:rgba(18,21,29,0);--bg85:rgba(18,21,29,.85);--glass:rgba(30,35,48,.9);--card:#1E2330;--card2:#262C3B;--shadow:rgba(0,0,0,.3)}
html.dark .btn.r{color:#C9C0FF}
html.dark .toast{background:#E8ECF5;color:#12151D}
html.dark .note{color:#F7C1D6}
html.dark .imp h3{color:#C9C0FF}
html.dark .group{--cbg:var(--glass)}
html.dark .blobs i{opacity:.5}
html.dark .chip .m{background:var(--card2)}
/* Wischen auf der Einkaufsliste */
.swipe{position:relative;margin-bottom:6px;border-radius:999px;overflow:hidden}
.swacts{opacity:0;transition:opacity .15s;position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;gap:0;border-radius:999px;overflow:hidden}
.sw{border:0;font-weight:700;font-size:14px;color:#fff;width:88px;cursor:pointer;transition:width .15s}
.sw.amt{background:var(--blue)}
.sw.del{background:#E05A5A;border-radius:0 999px 999px 0}
.swipe.swiping .swacts{opacity:1}
.swipe.far .sw.amt{width:0;padding:0;overflow:hidden}
.swipe.far .sw.del{width:100%}
.swipe.gone{transition:opacity .18s;opacity:0}
.note-line{display:flex;align-items:center;gap:4px;color:var(--rosa-d);font-size:13px;line-height:1.35}
.note-line b{font-weight:600}
.nx{border:0;background:none;color:var(--ink3);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex:none}
.emptyart{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink3);font-weight:600;padding:36px 20px}
.emptyart svg{width:130px;height:98px}
.greytxt{color:var(--ink3);font-size:14px;padding:4px 8px;line-height:1.45}
/* Rezepte */
.tiles{display:flex;gap:10px;overflow-x:auto;margin:14px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;border:0;color:#fff;font-weight:800;font-size:15px;width:150px;height:76px;border-radius:22px;padding:12px 14px;text-align:left;display:flex;align-items:flex-end;cursor:pointer;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:58% 42% 61% 39% / 47% 58% 42% 53%;background:rgba(255,255,255,.22)}
.tile.on{outline:3px solid var(--ink);outline-offset:2px}
.thumb{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--blue-d);background:var(--blue-l)}
.thumb.ph.c1{background:var(--rosa);color:var(--rosa-d)}.thumb.ph.c2{background:#E6F4E8;color:#2F8A4A}
.heart{color:var(--ink3)}.heart.on{color:#F06AA0}
.heart:not(.on) .fa{fill:none;stroke:currentColor;stroke-width:44px}
.pill{font-size:13px;font-weight:600;background:var(--blue-l);opacity:.8;color:var(--blue-d);border-radius:999px;padding:5px 12px}
.pill.t{background:var(--rosa);opacity:.55;color:var(--rosa-d)}
.banner{margin:-4px 0 12px}
.banner img{width:100%;max-height:260px;object-fit:cover;border-radius:40px 32px 38px 30px / 32px 40px 30px 38px;display:block}
.nutri{background:var(--card);border-radius:30px 24px 28px 22px / 24px 30px 22px 28px;padding:12px 18px;margin-top:10px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.nutri b{color:var(--ink)}
.nutri .greytxt{padding:2px 0 0;font-size:13px}
.chip .kc{font-size:12px;color:var(--ink2);white-space:nowrap}
.ingwrap{margin-bottom:6px}
.ingwrap .ing{margin-bottom:0}
.prodline{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--blue-d);margin:2px 0 0 16px}

:is(#art,[data-cid=art]){width:48px;height:48px}
.hrow{gap:10px;overflow:hidden}
h1{font-size:clamp(19px,5.8vw,25px);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(#status,[data-cid=status]):empty{display:none}
:is(#gear,[data-cid=gear]),:is(#who,[data-cid=who]){width:48px;height:48px;flex:none}
html,body{overflow-x:clip}
#peeklayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
#peeklayer>*{z-index:auto!important}
/* Einkaufsliste luftiger */
.listtop{margin-bottom:22px}
.listtop .schips{margin-top:12px}
.swipe{margin-bottom:12px}
.item{padding:14px 18px 14px 14px;gap:14px}
.flatlist .swipe.gap{margin-top:24px}
/* aktiver Tab links/rechts deutlich */
.tabs .side{position:relative;color:var(--ink3);transition:color .25s}
.tabs .side::before{content:'';position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:var(--grad);transform:translate(-50%,-50%) scale(.4);opacity:0;transition:transform .3s cubic-bezier(.3,.9,.3,1.2),opacity .2s;z-index:0;box-shadow:0 8px 18px -8px rgba(91,100,255,.9)}
.tabs .side .fa{position:relative;z-index:1}
.tabs .side.on{color:#fff}
.tabs .side.on::before{transform:translate(-50%,-50%) scale(1);opacity:1}
body.swiping *{transition-property:none}
body.swiping :active{transform:none!important;filter:none!important}
.mealseg button{font-size:13.5px}
.fsec .inp{width:100%;box-sizing:border-box;background:var(--bg)}
/* Titel wischt innerhalb der festen Kopfleiste */
.htitle{flex:1;min-width:0;overflow:hidden;position:relative;align-self:stretch;display:flex}
.htrack{display:flex;align-items:center;gap:10px;min-width:0;width:100%;will-change:transform}
.htrack.clone{position:absolute;inset:0}
.htrack h1{flex:1}
/* Eingabefelder gut sichtbar */
.field,.inp,.damt{background:color-mix(in srgb,#5B7FFF 7%,var(--card))!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#5B7FFF 24%,transparent)!important}
.field:focus,.inp:focus,.damt:focus{box-shadow:inset 0 0 0 2px #6B6BFF,0 0 0 4px color-mix(in srgb,#6B6BFF 18%,transparent)!important}
.field::placeholder,.inp::placeholder{color:color-mix(in srgb,#4A55B0 55%,var(--ink3))}
/* Auswahl Neu: zwei gleiche Kacheln */
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{align-items:center;text-align:center;padding:22px 14px 20px;gap:10px;background:linear-gradient(135deg,color-mix(in srgb,#5B7FFF 12%,var(--card)),color-mix(in srgb,#B06BFF 12%,var(--card)));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#7B5CFF 30%,transparent),0 8px 18px -12px rgba(110,90,255,.7);border-radius:32px}
.choice .ci{width:56px;height:56px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(91,100,255,.9)}
.choice .ci .fa{width:24px;height:24px;fill:#fff;color:#fff}
.choice b{font-size:16px}.choice span{font-size:12.5px;line-height:1.35}
#stage{position:relative;z-index:2}
.stageclone{z-index:6}
.stageclone header{background:linear-gradient(var(--bg) 70%,transparent)}

/* Formen bleiben bei jedem Seitenwechsel gleich */
body[data-tab] .blobs .b1{left:calc(100% - var(--bw) * .54)!important;top:16%!important;background:var(--rosa)!important;opacity:.55!important;border-radius:58% 42% 61% 39% / 47% 58% 42% 53%!important}
body[data-tab] .blobs .b2{left:calc(var(--bw) * -.49)!important;top:calc(100% - var(--bot) - 6% - var(--bh))!important;background:var(--blue-l)!important;opacity:.8!important;border-radius:43% 57% 38% 62% / 56% 41% 59% 44%!important}
.blobs i{transition:none!important}
.blobs{will-change:transform}
.stageclone{opacity:1}
/* horizontales Wischen bleibt bei der App */
body{touch-action:pan-y}
/* Hohe Fenster: Kopf bleibt stehen, Inhalt scrollt darunter */
.sheet.full{height:90vh;max-height:90vh;padding-top:0}

.sheet .grab{position:sticky;z-index:3}
.sheet .grab{top:10px;z-index:4;margin:0 auto -5px;background:var(--ink3);box-shadow:none}


/* Nährstoff-Gläser: Text bleibt innen */
.jar{height:132px;padding:12px 18px 16px}
.jname{font-size:11.5px;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.jpct{font-size:18px!important}
.jcov,.jsub{font-size:10px}
.dtext{min-height:56px!important}
.dpt{margin:0 4px 10px}
.micwrap{margin:2px 0 16px}
.micbtn{width:76px;height:76px}
.dsum{margin:6px 0 4px}
/* Fenster: weniger hoch, Hintergrund weichgezeichnet, mehr Luft */
.ov{background:rgba(20,26,40,.18);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
html.dark .ov{background:rgba(0,0,0,.35)}
.sheet{padding-left:22px;padding-right:22px}
.sheet .shead{margin:0 0 18px;padding:22px 2px 0;box-shadow:none;background:none}
.sheet.full{height:80vh;max-height:80vh}
.sheet.full .shead{padding-top:24px}
.npage{gap:22px}
.npage .dstrip{gap:10px;padding:8px 2px 4px}
.npage .jarsec+.jarsec{margin-top:10px!important}
.npage .jars{gap:14px}
.npage .rephero{padding:22px 16px 20px}
/* Nährstoffe: deutlich mehr Luft */
.npage{gap:28px}
.npage .jars{gap:20px 16px}
.npage .jarsec h3{margin:4px 4px 16px;font-size:18px}
.npage .jarsec+.jarsec{margin-top:18px!important}
.npage .legend{gap:8px 18px}
.npage .rephero{padding:26px 18px 24px}
.npage .dstrip{gap:12px}
.nutpage .infocard{margin-bottom:18px;padding:18px 20px}
.nutpage .nuthero{margin-bottom:22px}
/* Woche als eigene Karte mit runden, gleich verteilten Tagen */
.weekcard{background:var(--card);border-radius:34px;box-shadow:0 2px 12px var(--shadow);padding:16px 16px 20px}
.weekcard .pnav{margin:0 0 16px!important}
.weekcard .pnav .ib{width:40px;height:40px}
.weekcard .dstrip{display:flex!important;flex-direction:row!important;justify-content:space-between;gap:0!important;padding:0!important}
.weekcard .dj{width:38px;height:38px;aspect-ratio:auto;border-radius:50%!important;flex:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink3) 30%,transparent)}
.weekcard .dj.logged{box-shadow:inset 0 0 0 2px var(--j2)}
.weekcard .dj.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px #7B5CFF}
.weekcard .djl{font-size:12.5px}
.weekcard .dj .wave{display:none}

/* Runde 15: Kreise, Glas, Farben */
html{background:#E8F0FF linear-gradient(180deg,#E8F0FF 0%,#E8F0FF 6%,#EEF1FF 45%,#F3ECFF 100%) fixed}
html.dark{background:#121827 linear-gradient(180deg,#121827 0%,#121827 6%,#151A2B 50%,#1B1729 100%) fixed}
:root{--glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.75)}
html.dark{--glass:rgba(34,40,58,.6);--glassb:rgba(255,255,255,.08)}
header{background:none!important}
.hrow,.tabs{background:var(--glass)!important;-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--glassb),0 10px 30px -12px rgba(60,70,140,.28)!important}
.day,.rectop,.weekcard,.rephero,.fsec,.setcard,.infocard,.rcard,.donebox,.pcta,.calbar+.row .seg{background:var(--glass)!important;box-shadow:inset 0 0 0 1px var(--glassb),0 8px 24px -14px rgba(60,70,140,.3)!important}
.day.today{background:linear-gradient(var(--glass),var(--glass)) padding-box,linear-gradient(120deg,#4C74FF,#9A6BFF 55%,#FF8FC0) border-box!important;box-shadow:0 0 22px -4px rgba(130,110,255,.45)!important}
.sheet{background:linear-gradient(175deg,#EEF3FF,#F5F1FF)!important}
html.dark .sheet{background:linear-gradient(175deg,#161C2C,#1A1729)!important}
.ov{background:rgba(30,40,80,.16)}
/* Liste: Rand in der Kategoriefarbe */
.item{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cfg,#8891A5) 45%,transparent)}
/* Nährstoff-Kreise */
.jar.ring{height:auto!important;padding:0 2px 4px!important;background:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:6px;animation:none}
.jar.ring .rwrap{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:48% 52% 50% 50% / 52% 48% 52% 48%;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassb),0 8px 18px -10px rgba(60,70,140,.35)}
.ringsvg{position:absolute;inset:0;width:100%;height:100%}
.jar.ring .jpct{font-size:17px!important;font-weight:800;position:relative}
.jar.ring .jname{font-size:13px;font-weight:700;line-height:1.2;text-align:center}
.jar.ring .jsub{font-size:11px;color:var(--ink3);margin-top:-3px}
.npage .jars{gap:22px 10px}
.nhring{position:relative;width:120px;height:120px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassb),0 12px 26px -12px rgba(60,70,140,.4)}
.nhring .nhpct{position:relative;font-size:26px;font-weight:800}
.nhglow{display:none}
.legend .lg i{border-radius:50%}
/* mehr Farbe */
body{background:transparent!important}
.blobs .b1,.blobs .b2{filter:saturate(1.35)}
.day .dlabel{background:linear-gradient(135deg,#DCE6FF,#E9DEFF)!important}
html.dark .day .dlabel{background:linear-gradient(135deg,#25305A,#2E2750)!important}
.day.today .dlabel{background:var(--grad)!important;color:#fff}
.day.today .dlabel .wd{color:rgba(255,255,255,.85)}
.btn.s{background:linear-gradient(135deg,color-mix(in srgb,#5B7FFF 16%,var(--glass)),color-mix(in srgb,#B06BFF 16%,var(--glass)))!important;box-shadow:inset 0 0 0 1px var(--glassb)}
.chip,.pill{box-shadow:inset 0 0 0 1px var(--glassb)}

/* Runde 16: haptische Tiefe */
:root{--hi:inset 0 1.5px 0 rgba(255,255,255,.95);--lo:inset 0 -2px 6px rgba(80,90,170,.10);--drop:0 1px 2px rgba(40,50,110,.08),0 10px 24px -10px rgba(60,70,150,.35),0 24px 40px -28px rgba(60,70,150,.35)}
html.dark{--hi:inset 0 1px 0 rgba(255,255,255,.12);--lo:inset 0 -2px 6px rgba(0,0,0,.35);--drop:0 1px 2px rgba(0,0,0,.4),0 12px 28px -12px rgba(0,0,0,.7)}
/* Karten: Licht von oben, Schatten nach unten */
.day,.rectop,.weekcard,.rephero,.fsec,.setcard,.infocard,.rcard,.donebox,.pcta,.item,.hrow,.tabs{box-shadow:var(--hi),var(--lo),inset 0 0 0 1px var(--glassb),var(--drop)!important}
.day.today{box-shadow:var(--hi),0 0 26px -4px rgba(130,110,255,.5),var(--drop)!important}
.item{box-shadow:var(--hi),var(--lo),inset 0 0 0 1.5px color-mix(in srgb,var(--cfg,#8891A5) 45%,transparent),0 6px 16px -10px rgba(60,70,150,.35)!important}
/* Buttons mit Glanz */
.btn.grad,.btn.p,.ib.p,.seg button.on,.tabs .mid.on .bub,.tabs .side::before,.day.today .dlabel,.choice .ci,.prepday.on,.varb.on,.palopt.on{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad)!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(40,20,120,.25),0 10px 20px -8px rgba(91,90,255,.75)!important}
.btn.s,.ib:not(.p),.dlabel,.seg.wide,.field,.inp{box-shadow:var(--hi),var(--lo),inset 0 0 0 1px var(--glassb),0 4px 10px -6px rgba(60,70,150,.3)!important}
.field:focus,.inp:focus{box-shadow:inset 0 2px 4px rgba(60,70,150,.15),inset 0 0 0 2px #6B6BFF!important}
/* inaktive Mitte blasser */
.tabs .mid:not(.on) .bub{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 16px -10px rgba(91,90,255,.5)!important}
/* Gedrückt: reinsinken statt nur kleiner */
button:active,.chip:active,.day:active{filter:none}
/* Kategorie-Kacheln plastischer */
.tile{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -6px 14px rgba(0,0,0,.12),0 12px 22px -12px rgba(40,40,90,.45)!important}
/* Nährstoff-Kreise mit Wölbung */
.jar.ring .rwrap,.nhring{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),var(--glass) 62%)!important;box-shadow:var(--hi),inset 0 -4px 10px rgba(80,90,170,.14),var(--drop)!important}
html.dark .jar.ring .rwrap,html.dark .nhring{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.12),var(--glass) 62%)!important}
.ringarc{filter:drop-shadow(0 2px 3px rgba(60,60,160,.3))}
/* Abhakkreis wie ein Knopf */
.cb{box-shadow:inset 0 2px 4px rgba(40,50,110,.18),0 1px 0 rgba(255,255,255,.9)}

/* Runde 17: flüssiger, saubere Ränder, Zurück und Quellen */
:root{--drop:0 1px 2px rgba(40,50,110,.07),0 8px 18px -10px rgba(60,70,150,.32)}
html.dark{--drop:0 1px 2px rgba(0,0,0,.35),0 10px 20px -12px rgba(0,0,0,.6)}
/* Beim Wischen kein Live-Blur in der bewegten Seite, das kostet pro Bild am meisten */
body.moving #stage,.stageclone{will-change:transform}
/* Listeneintrag: eine klare Kante statt mehrerer Schatten */
.item{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cfg,#8891A5) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.9),0 4px 10px -6px rgba(60,70,150,.28)!important;background:color-mix(in srgb,var(--cfg,#8891A5) 10%,var(--card))!important}
html.dark .item{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cfg,#8891A5) 55%,transparent),0 4px 10px -6px rgba(0,0,0,.5)!important;background:color-mix(in srgb,var(--cfg,#8891A5) 14%,var(--card))!important}
.donebox .item{box-shadow:inset 0 0 0 1px var(--glassb)!important;background:var(--card)!important}
.item .cb{box-shadow:inset 0 1.5px 3px rgba(40,50,110,.16)}
/* Zurück oben in der Nährstoff-Detailansicht */
.backlink{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:var(--glass);color:var(--ink);font:600 15px/1 inherit;font-family:inherit;padding:10px 16px 10px 12px;border-radius:999px;box-shadow:var(--hi),inset 0 0 0 1px var(--glassb),0 4px 10px -6px rgba(60,70,150,.3);margin-bottom:-6px}
.backlink svg{width:14px;height:14px}
/* Gute Quellen: antippbar */
.gsrcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gsrc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;text-align:left;border:0;border-radius:20px;padding:12px 44px 12px 14px;background:var(--glass);color:var(--ink);font-family:inherit;box-shadow:var(--hi),inset 0 0 0 1px var(--glassb),0 4px 10px -6px rgba(60,70,150,.3);min-height:52px;justify-content:center}
.gsrc .gn{font-weight:650;font-size:14.5px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.gsrc .gw{font-size:12px;color:var(--muted)}
.gsrc .gp{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 8px -4px rgba(91,90,255,.7)}
.gsrc .gp svg{width:12px;height:12px}
.gsrc.on .gp{background:#22B07D}

/* Runde 18: Tage mit eigener Farbe, Herz, Nährstoff-Kopf */
.day.wd0{--dh:#4F7BFF}.day.wd1{--dh:#6B5BFF}.day.wd2{--dh:#9A5BF0}.day.wd3{--dh:#D05ACB}.day.wd4{--dh:#EE6A9A}.day.wd5{--dh:#F28A5C}.day.wd6{--dh:#2FB3C6}
.day:not(.today){background:linear-gradient(100deg,color-mix(in srgb,var(--dh) 16%,var(--glass)) 0%,var(--glass) 70%)!important}
.day:not(.today) .dlabel,html.dark .day:not(.today) .dlabel{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(140deg,color-mix(in srgb,var(--dh) 55%,#fff),var(--dh))!important;color:#fff!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.12),0 8px 16px -8px color-mix(in srgb,var(--dh) 80%,transparent)!important}
.day:not(.today) .dlabel .wd{color:rgba(255,255,255,.88)!important}
.day:not(.today) .ib.p{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(140deg,color-mix(in srgb,var(--dh) 70%,#fff),var(--dh))!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 8px 16px -8px color-mix(in srgb,var(--dh) 80%,transparent)!important}
.day:not(.today) .empty{color:color-mix(in srgb,var(--dh) 45%,var(--ink3))}
html.dark .day:not(.today){background:linear-gradient(100deg,color-mix(in srgb,var(--dh) 22%,var(--glass)) 0%,var(--glass) 70%)!important}
html.dark .day.today .dlabel{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad)!important;color:#fff}
.rtagrow{display:flex;align-items:flex-start;gap:10px;margin:2px 4px 4px}
.rtags{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.rtagrow .heart{flex:none}
.phero2{display:flex;flex-direction:column;gap:20px;padding:22px 20px!important;text-align:left}
.ph2top{display:flex;align-items:center;gap:18px}
.ph2ring{position:relative;width:104px;height:104px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),var(--glass) 62%);box-shadow:var(--hi),inset 0 -4px 10px rgba(80,90,170,.14),var(--drop)}
html.dark .ph2ring{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.12),var(--glass) 62%)}
.ph2ring svg{position:absolute;inset:0;width:100%;height:100%}
.ph2pct{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph2txt{display:flex;flex-direction:column;gap:4px}
.ph2txt b{font-size:22px;font-weight:800}
.ph2txt span{font-size:14px;color:var(--ink3)}
.macs{display:flex;flex-direction:column;gap:14px}
.macl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin:0 2px 6px}
.macv{color:var(--ink3);font-weight:500;font-size:13.5px}
.macv b{color:var(--ink);font-weight:750;font-size:15px}
.macbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--ink3) 14%,transparent);box-shadow:inset 0 1px 2px rgba(40,50,110,.15);overflow:hidden}
.macbar i{display:block;height:100%;border-radius:99px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.macs.zero .macbar i{display:none}
.mac.k i{background:linear-gradient(90deg,#6B5BFF,#4F7BFF)}
.mac.p i{background:linear-gradient(90deg,#EE6A9A,#D05ACB)}
.mac.c i{background:linear-gradient(90deg,#F2A65C,#F28A5C)}
.mac.f i{background:linear-gradient(90deg,#2FC6B0,#2FB3C6)}

/* Runde 19: Rezeptansicht, heutiger Tag, Drück-Feedback */
.rhero2{position:relative;overflow:hidden;border-radius:34px;padding:18px 16px 16px;margin:4px 0 22px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%),linear-gradient(135deg,#4F7BFF 0%,#6B5BFF 45%,#C463E0 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -6px 14px rgba(40,20,120,.2),0 18px 34px -16px rgba(91,90,255,.75)}
.rhero2::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);pointer-events:none}
.rhero2 .rtagrow{margin:0 0 16px;align-items:center}
.rchip{font-size:13.5px;font-weight:650;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.4);color:#fff}
.rheart{flex:none;width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.5);color:#fff;transition:transform .15s}
.rheart svg{width:18px;height:18px}
.rheart.on{background:#fff;color:#F0609B}
.nutri2{position:relative;z-index:1}
.mbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{display:flex;flex-direction:column;align-items:center;gap:6px}
.mbc{width:100%;aspect-ratio:1;max-width:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 28%,#fff,rgba(255,255,255,.86) 65%);box-shadow:inset 0 -3px 8px rgba(60,40,140,.15),0 8px 16px -8px rgba(30,20,90,.55)}
.mbc b{font-size:19px;font-weight:800;line-height:1.05}
.mbc span{font-size:11px;font-weight:700;color:var(--ink3)}
.mb.k b{color:#4F5BFF}.mb.p b{color:#D9488C}.mb.c b{color:#E07A3A}.mb.f b{color:#1E9FB0}
.mbl{font-size:12.5px;font-weight:650;color:rgba(255,255,255,.95)}
.n2foot{margin-top:12px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.85)}
.rhero2 .greytxt,.rhero2 .muted{color:rgba(255,255,255,.8)!important}
html.dark .mbc{background:radial-gradient(circle at 35% 28%,#3A3F66,#262A45 65%)}
html.dark .mb.k b{color:#9AA4FF}html.dark .mb.p b{color:#FF8DBE}html.dark .mb.c b{color:#FFB07A}html.dark .mb.f b{color:#6FD8E6}
.ingview2{display:flex;flex-direction:column;gap:8px}
.ing2{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:99px;background:color-mix(in srgb,var(--ic) 10%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ic) 35%,transparent)}
.idot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ic);box-shadow:0 0 0 4px color-mix(in srgb,var(--ic) 22%,transparent)}
.ing2 .in{flex:1;font-weight:600;font-size:15.5px}
.ing2 .ia{font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:99px;background:var(--card);color:color-mix(in srgb,var(--ic) 70%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 30%,transparent)}
.stepview .k{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad)!important;color:#fff!important;box-shadow:0 6px 12px -6px rgba(91,90,255,.8)}
/* heutiger Tag in der Wochenleiste: gefüllt statt unterstrichen */
.weekcard .dj.today{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -6px rgba(91,90,255,.85)!important}
.weekcard .dj.today .djl{color:#fff!important;text-decoration:none}
.weekcard .dj.today .jfill{display:none}
.weekcard .dj.today.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px #7B5CFF,0 6px 14px -6px rgba(91,90,255,.85)!important}
/* Drücken: leicht kleiner und heller, nicht eingedrückt */
.btn:active,.ib:active,.seg button:active,.day:active,.chip:active,.rcard:active,.tile:active,.gsrc:active,.rheart:active,.dj:active,.backlink:active{transform:scale(.96)!important;filter:brightness(1.06)}
.btn,.ib,.seg button,.day,.chip,.rcard,.tile,.gsrc,.rheart,.dj,.backlink{transition:transform .16s cubic-bezier(.3,.7,.4,1.4),filter .16s}

/* Zutaten: ruhige Liste statt einzelner Kapseln */
.ingview2{display:flex;flex-direction:column;gap:0;margin:0 -2px}
.ing2{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:14px;padding:13px 6px;border-radius:0;background:none!important;box-shadow:none!important;border-bottom:1px solid color-mix(in srgb,var(--ink3) 16%,transparent)}
.ing2:last-child{border-bottom:0}
.idot{width:10px;height:10px;box-shadow:none}
.ing2 .in{font-weight:550;font-size:16px}
.ing2 .ia{padding:0;background:none;box-shadow:none;color:var(--ink);font-weight:750;font-size:15px;text-align:right;white-space:nowrap}
#sheet{overscroll-behavior:contain}

/* Runde 20: Blatt-Hintergrund als eigene Ebene, nur Deckkraft animieren */
.ov,html.dark .ov{background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important}
.ov::before{content:"";position:absolute;inset:0;background:rgba(30,40,80,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:var(--ovo,1);transition:opacity .26s ease;will-change:opacity;animation:ovfade .3s ease}
html.dark .ov::before{background:rgba(0,0,0,.35)}
.ov.out::before{opacity:0}
@keyframes ovfade{from{opacity:0}}
.ov>#sheet{position:relative;z-index:1}
#sheet{will-change:transform;contain:layout paint}


/* Runde 21: kein Titelbalken mehr, großer Titel frei auf der Seite, Knöpfe als Liquid Glass */
header,.stageclone header{position:relative!important;top:auto!important;background:none!important;padding:calc(var(--top) + 8px) 20px 4px!important}
.hrow{background:none!important;box-shadow:none!important;border-radius:0!important;padding:6px 0!important;overflow:visible!important;gap:12px!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:is(#title,[data-cid=title]){font-size:clamp(24px,7.8vw,32px)!important;font-weight:800;letter-spacing:-.025em;padding-left:2px}
:is(#art,[data-cid=art]){display:none!important}
:is(#gear,[data-cid=gear]),:is(#who,[data-cid=who]){width:46px!important;height:46px!important;border:0;position:relative;
  -webkit-backdrop-filter:blur(10px) saturate(1.8);backdrop-filter:blur(10px) saturate(1.8)}
:is(#gear,[data-cid=gear]){background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(255,255,255,.22))!important;color:#4A55A8;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,1),inset 0 -1px 1px rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -6px 12px rgba(120,130,220,.12),0 8px 20px -8px rgba(60,70,150,.45)!important}
:is(#who,[data-cid=who]){background-image:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 52%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.12))!important;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -5px 10px rgba(0,0,0,.15),0 8px 20px -8px rgba(60,70,180,.6)!important}
html.dark :is(#gear,[data-cid=gear]){background:linear-gradient(150deg,rgba(255,255,255,.18),rgba(255,255,255,.05))!important;color:#C9D2FF;box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),0 8px 20px -8px rgba(0,0,0,.7)!important}
/* Untere Leiste als Liquid Glass */
.tabs{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.2))!important;-webkit-backdrop-filter:blur(18px) saturate(1.9)!important;backdrop-filter:blur(18px) saturate(1.9)!important;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,1),inset 0 -1px 1px rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.5),inset 0 -10px 20px rgba(120,130,220,.1),0 16px 34px -14px rgba(60,70,150,.45)!important}
html.dark .tabs{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04))!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),0 16px 34px -14px rgba(0,0,0,.7)!important}
/* Verlauf unten ohne Weichzeichner: der wird beim Wischen sonst jedes Bild neu berechnet */
.tabfade{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* Inhalt läuft weich unter die Statusleiste statt hart abgeschnitten */
._unused_topfade{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + 18px);z-index:6;pointer-events:none;background:linear-gradient(#E8F0FF 0%,#E8F0FF calc(var(--top) * .4),rgba(232,240,255,0))}
html.dark .topfade{background:linear-gradient(#121827 0%,#121827 calc(var(--top) * .4),rgba(18,24,39,0))}

/* Runde 22 */
/* 1: J als Knopf, nicht als Kugel */
:is(#who,[data-cid=who]){background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.18),0 6px 16px -8px rgba(60,70,180,.45)!important;font-weight:750}
/* 2, 8, 9: gleicher Abstand unter jedem Titel, etwas mehr Luft */
header,.stageclone header{padding-bottom:18px!important}
:is(#main,[data-cid=main]){padding-top:0!important}
.calbar{margin-top:0!important}
.rectop{margin-top:0!important}
.calbar+.row{margin-bottom:26px!important}
.listtop{margin-bottom:26px!important}
/* 3: Im Wagen als ruhige, kleine Liste */
.donebox{padding:16px 18px 10px!important;text-align:left!important}
.donechips{display:flex;flex-direction:column;gap:0}
.donerow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 2px;font:inherit;color:var(--ink2);text-align:left;border-bottom:1px solid color-mix(in srgb,var(--ink3) 14%,transparent);cursor:pointer}
.donerow:last-child{border-bottom:0}
.dck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;background:#22B07D;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.dck svg{width:10px;height:10px}
.dnm{flex:1;font-size:15px;font-weight:550}
.dq{font-size:13.5px;color:var(--ink3)}
/* 4: Einträge etwas flacher */
.item{padding:7px 14px 7px 10px!important;min-height:0}
.item .cb{width:26px;height:26px}
.flatlist{gap:8px}
/* 18: Abhaken */
.item .cb{transition:background .16s,border-color .16s,color .16s,transform .16s}
.item.ticked .cb{background:#22B07D!important;border-color:#22B07D!important;color:#fff!important;transform:scale(1.12)}
.item.ticked .nm{color:var(--ink3);transition:color .16s}
/* 5: weiche Schatten ohne sichtbaren zweiten Kasten */
:root{--lo:inset 0 0 0 0 transparent;--drop:0 1px 3px rgba(40,50,110,.05),0 12px 30px -14px rgba(60,70,150,.22)}
html.dark{--drop:0 1px 3px rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.55)}
.btn.grad,.btn.p,.ib.p,.seg button.on,.tabs .mid.on .bub,.tabs .side::before,.day.today .dlabel,.choice .ci,.prepday.on,.varb.on,.palopt.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px -8px rgba(91,90,255,.5)!important}
.tile{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -14px rgba(40,40,90,.35)!important}
.day:not(.today) .dlabel{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -8px color-mix(in srgb,var(--dh) 50%,transparent)!important}
.day:not(.today) .ib.p{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -8px color-mix(in srgb,var(--dh) 50%,transparent)!important}
.btn.s,.ib:not(.p),.dlabel,.seg.wide,.field,.inp{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px var(--glassb),0 4px 12px -8px rgba(60,70,150,.25)!important}
.day.today{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 24px -6px rgba(130,110,255,.45),0 12px 30px -14px rgba(60,70,150,.25)!important}
/* 7: "nichts geplant" am heutigen Tag lesbar */
.day.today .empty{color:#2E2A78!important;opacity:.72;font-weight:600}
html.dark .day.today .empty{color:#fff!important;opacity:.8}
/* 10: Kachel-Zahl nicht abgeschnitten */
.tile{font-size:14.5px;gap:8px;padding-left:14px;padding-right:12px}
.tile span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tcount{flex:none}

/* 6: Ring lädt, Balken wachsen beim Tageswechsel */
@keyframes ringgrow{from{stroke-dasharray:0 252}}
@keyframes bargrow{from{transform:scaleX(0)}}
.npage .ringarc,.nutpage .ringarc{animation:ringgrow .65s cubic-bezier(.2,.8,.2,1) both}
.macbar i{transform-origin:left center;animation:bargrow .6s cubic-bezier(.2,.8,.2,1) both}
.macs .mac:nth-child(2) i{animation-delay:.05s}.macs .mac:nth-child(3) i{animation-delay:.1s}.macs .mac:nth-child(4) i{animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.npage .ringarc,.macbar i{animation:none}}

/* 11: gleitender Kreis in der Tab-Leiste */
.tabs{position:fixed}
.tind{position:absolute;left:0;top:50%;width:52px;height:52px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px -8px rgba(91,90,255,.5)}
.tabs .side::before{display:none!important}
.tabs button{position:relative;z-index:1}
.tabs .side{transition:color .2s}
.tabs .side.near,.tabs .side.on{color:#fff!important}
.tabs .mid .bub{transition:background .25s,box-shadow .25s}

/* 16/17: Umschalter mit Luft zum Rand und gleitendem Marker */
.seg{position:relative}
.seg>button{position:relative;z-index:1;padding-left:12px!important;padding-right:12px!important;transition:color .2s}
.seg>button.on{background:transparent!important;box-shadow:none!important;color:#fff}
.segi{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;z-index:0;pointer-events:none;opacity:0;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -8px rgba(91,90,255,.5)}
.seg.wide{padding:5px!important;gap:4px!important}
.seg.wide .segi{top:5px;bottom:5px}
.mealseg>button{font-size:14px!important}
/* 18: Überschriften in Blättern hervorheben */
.sheet .shead h2{font-size:28px!important;letter-spacing:-.025em;font-weight:800}
.fsec h3{font-size:17px!important;font-weight:800!important;color:var(--ink)!important;letter-spacing:-.01em}
/* 12-15: Meal Prep mit Farbe */
.choice.mp .ci{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(135deg,#0F9F8F,#7ADCC8)!important}
.fsh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.fsh h3{margin:0!important}
.mpopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mpopt{border:0;border-radius:28px;padding:20px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-family:inherit;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -14px rgba(40,40,90,.45)}
.mpopt.a{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%),linear-gradient(135deg,#0F9F8F,#58C9B4)}
.mpopt.b{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%),linear-gradient(135deg,#5B6BFF,#A77BFF)}
.mpopt .ci{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.mpopt .ci svg{width:18px;height:18px}
.mpopt b{font-size:16px}.mpopt span:last-child{font-size:12.5px;opacity:.9}
.mpsel{display:flex;align-items:center;gap:14px}
.mpi{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#0F9F8F,#7ADCC8)}
.mpi.big{width:52px;height:52px;font-size:20px}
.mpst{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.mpst b{font-size:17px}.mpst span{font-size:13px;color:var(--ink3)}
.mpcats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.mpcat{border:0;border-radius:99px;padding:8px 14px;font:600 13.5px/1 inherit;font-family:inherit;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--glassb)}
.mpcat.on{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.mplist{display:flex;flex-direction:column;margin-top:8px}
.mprow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 2px;text-align:left;font-family:inherit;color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--ink3) 14%,transparent)}
.mprow:last-child{border-bottom:0}
.mprow .mpt{flex:1;font-weight:600;font-size:15.5px}.mprow .mps{font-size:12.5px;color:var(--ink3)}
.mpstep{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mpv{display:flex;align-items:baseline;gap:8px}.mpv b{font-size:30px;font-weight:800;background:linear-gradient(135deg,#0F9F8F,#5B6BFF);-webkit-background-clip:text;background-clip:text;color:transparent}.mpv span{font-size:15px;color:var(--ink2);font-weight:600}
.mpstep .ib{width:46px;height:46px;font-size:22px}
.mpres{margin:4px 0 22px;border-radius:30px;padding:20px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%),linear-gradient(135deg,#0F9F8F,#5B6BFF 70%,#A77BFF);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px -16px rgba(40,60,140,.6)}
.mpres b{font-size:26px;font-weight:800}.mpres span{font-size:13.5px;opacity:.9}
/* 19: Mikrofon als Icon im Feld */
.micwrap{position:relative}
.micwrap>.inp,.micwrap>.field,.micwrap>textarea{padding-right:58px!important;width:100%;box-sizing:border-box}
.micb{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -8px rgba(91,90,255,.6);z-index:2}
.micwrap>.field+.micb,.micwrap>input+.micb{top:50%;transform:translateY(-50%)}
.micb svg{width:15px;height:15px}
.micb.rec{background:#E5484D;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.18)}}
.imp .btn svg{width:14px;height:14px;margin-right:4px;vertical-align:-2px}
/* 20: Kategorien erkannt */
.tagb.auto.on{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(135deg,#0F9F8F,#58C9B4)!important;color:#fff!important}
.tagnote{width:100%;font-size:12.5px;margin:6px 2px 0}
/* 21: Rezept mit Foto */
.sheet.haspic>.shead{display:none}
.phero{position:relative;margin:-58px -20px 18px;height:300px;border-radius:40px 40px 0 0;overflow:hidden}
.phimg{position:absolute;inset:0;background:center/cover no-repeat;background-color:color-mix(in srgb,var(--ink3) 20%,var(--card))}
.phblur{position:absolute;inset:0;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);-webkit-mask-image:linear-gradient(transparent 35%,#000 85%);mask-image:linear-gradient(transparent 35%,#000 85%);
  background:linear-gradient(transparent 40%,color-mix(in srgb,var(--sheetbg,#EEF2FF) 85%,transparent) 100%)}
.phtitle{position:absolute;left:16px;right:16px;bottom:14px;padding:14px 22px;border-radius:28px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 #fff,0 10px 24px -14px rgba(30,30,80,.45)}
.phtitle h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#1B2233}
html.dark .phtitle{background:rgba(30,34,52,.8)}html.dark .phtitle h2{color:#fff}
.sheet.haspic .grab{position:relative;z-index:3}
/* 22: Herz in der Rezeptliste nicht abgeschnitten */
.rcard{overflow:visible!important;padding-right:12px!important}
.rcard .heart{flex:none;margin-left:2px}
/* 23: weißer Streifen: Overlay selbst wieder mit Farbe, Unschärfe nur in der Ebene darunter */
.ov,html.dark .ov{background-color:rgba(30,40,80,.16)!important;transition:background-color .26s ease}
html.dark .ov{background-color:rgba(0,0,0,.35)!important}
.ov::before{background:none!important}
.ov.out{background-color:rgba(30,40,80,0)!important}

/* Kachel-Zahl oben rechts, damit der Name ganz passt */
.tile:not(.v2):not(.v5){position:relative}
.tile:not(.v2):not(.v5) .tcount{position:absolute;top:9px;right:10px}
.tile:not(.v2):not(.v5) span:first-child{overflow:visible;text-overflow:clip;white-space:nowrap}
/* Umschalter mit mehreren Wörtern: Breite nach Inhalt */
.seg.wide>button{flex:1 1 auto!important;padding-left:8px!important;padding-right:8px!important;overflow:visible!important;text-overflow:clip!important}
.mealseg>button{font-size:13.5px!important}

/* Runde 23 */
/* Herz: Umriss ragt nicht mehr über den Rand */
.heart:not(.on) .fa{overflow:visible;stroke-width:40px}
.heart .fa{width:17px;height:17px}
/* Eingabefeld der Liste etwas tiefer */
.listtop{margin-top:10px!important}
/* J: plastisch wie die Mitte, aber keine Kugel */
:is(#who,[data-cid=who]){background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(20,20,90,.22),0 6px 16px -6px rgba(60,70,200,.55)!important}
/* Farbige Knöpfe: gleicher Glanz wie der mittlere Tab */
.btn.grad,.btn.p,.ib.p,.micb,.choice .ci{background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%),var(--grad)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(40,20,120,.22),0 8px 18px -8px rgba(91,90,255,.55)!important}
.micb.rec{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 52%),linear-gradient(135deg,#F06A6E,#D93A48)!important}
/* Gleitender Marker scharf */
.segi,.tind{backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* Tage in der Essenswoche flacher */
.day{padding-top:8px!important;padding-bottom:8px!important;min-height:0!important}
.day .dlabel{width:50px!important;height:50px!important}
.day .dlabel b,.day .dlabel .dn{font-size:20px}
/* Wochentage in allen Kalendern im gleichen Farblook */
.dj.wd0,.mday.wd0{--dh:#4F7BFF}.dj.wd1,.mday.wd1{--dh:#6B5BFF}.dj.wd2,.mday.wd2{--dh:#9A5BF0}.dj.wd3,.mday.wd3{--dh:#D05ACB}.dj.wd4,.mday.wd4{--dh:#EE6A9A}.dj.wd5,.mday.wd5{--dh:#F28A5C}.dj.wd6,.mday.wd6{--dh:#2FB3C6}
.weekcard .dj{border:0!important;background:color-mix(in srgb,var(--dh,#6B5BFF) 14%,var(--card))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 0 1.5px color-mix(in srgb,var(--dh,#6B5BFF) 30%,transparent)!important}
.weekcard .dj .djl{color:color-mix(in srgb,var(--dh,#6B5BFF) 75%,var(--ink))!important;font-weight:750}
.weekcard .dj .jfill{background:linear-gradient(180deg,color-mix(in srgb,var(--dh,#6B5BFF) 45%,#fff),var(--dh,#6B5BFF))!important;opacity:.55}
.weekcard .dj.today{background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%),linear-gradient(140deg,color-mix(in srgb,var(--dh,#6B5BFF) 60%,#fff),var(--dh,#6B5BFF))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.12),0 6px 14px -6px color-mix(in srgb,var(--dh,#6B5BFF) 70%,transparent)!important}
.weekcard .dj.today .djl{color:#fff!important}
.weekcard .dj.sel:not(.today){box-shadow:inset 0 0 0 2.5px var(--dh,#6B5BFF),0 6px 14px -8px color-mix(in srgb,var(--dh,#6B5BFF) 60%,transparent)!important}
.weekcard .dj.today.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--dh,#6B5BFF),0 6px 14px -6px color-mix(in srgb,var(--dh,#6B5BFF) 70%,transparent)!important}
html.dark .weekcard .dj:not(.today){background:color-mix(in srgb,var(--dh,#6B5BFF) 22%,var(--card))!important}

.mc.mday{background:linear-gradient(180deg,color-mix(in srgb,var(--dh) 12%,var(--glass)),var(--glass))!important}
.mc.mday .n{color:color-mix(in srgb,var(--dh) 75%,var(--ink))}
.mc.mday.has .n{background:color-mix(in srgb,var(--dh) 22%,var(--card));opacity:1}
.mc.mday .d{background:color-mix(in srgb,var(--dh) 16%,var(--card));opacity:1}
.mc.mday.today{box-shadow:inset 0 0 0 2px var(--dh)!important}
.mc.mday.today .n{background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%),linear-gradient(140deg,color-mix(in srgb,var(--dh) 60%,#fff),var(--dh));color:#fff}
.seg:not(:has(>.segi))>button.on{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--grad)!important}

/* Vorschlags-Pille über der Leiste */
.tippill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 104px);z-index:7;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border:0;border-radius:99px;font-family:inherit;color:var(--ink);text-align:left;max-width:calc(100% - 48px);
  background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,255,255,.4));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);
  box-shadow:inset 0 1px 1px #fff,inset 0 0 0 1px rgba(255,255,255,.55),0 12px 28px -12px rgba(60,70,150,.45)}
.tippill:active{transform:translateX(-50%) scale(.96)}
.tring{position:relative;width:34px;height:34px;flex:none}.tring svg{width:100%;height:100%}
.ttxt{display:flex;flex-direction:column;gap:1px;min-width:0}.ttxt b{font-size:14.5px;white-space:nowrap}.ttxt span{font-size:12px;color:var(--ink3);white-space:nowrap}
.tgo{color:var(--ink3);display:grid;place-items:center}.tgo svg{width:12px;height:12px}
.tipspace{height:76px}
html.dark .tippill{background:linear-gradient(160deg,rgba(60,66,96,.8),rgba(40,44,70,.6));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 28px -12px rgba(0,0,0,.6)}
.tiplows{display:flex;flex-direction:column;gap:14px}
.tiplow .macbar i{background:linear-gradient(90deg,#F2A65C,#EE6A9A)}
.tiplow{display:block;width:100%;border:0;background:none;padding:0;text-align:left;font-family:inherit;color:var(--ink)}
.tchev{display:inline-grid;place-items:center;margin-left:8px;color:var(--ink3);transition:transform .2s}.tchev svg{width:10px;height:10px}
.tiplow.open .tchev{transform:rotate(90deg)}
.tipfoods{margin-top:12px}
.tipgrp{padding-bottom:2px}
.macbar.two{display:flex}
.macbar.two i{border-radius:0}.macbar.two i:first-child{border-radius:99px 0 0 99px}.macbar.two i.b2:last-child{border-radius:0 99px 99px 0}
.macbar.two .b1{background:linear-gradient(90deg,#6B5BFF,#9A5BF0)!important}
.macbar.two .b2{background:linear-gradient(90deg,#F2A65C,#EE6A9A)!important;opacity:.85}
.tiplegend{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:var(--ink3);margin:0}
.tiplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tiplegend .lg1 i{background:#7B5BFF}.tiplegend .lg2 i{background:#F09A7A}
.hidden{display:none!important}
/* ===== Neues Design, Schritt 1: dunkel, ruhig, Linien statt Kästen ===== */
:root,html.dark{--bg:#0B0B0C;--bg0:rgba(11,11,12,0);--bg85:rgba(11,11,12,.92);--ink:#F2F2F4;--ink2:#B4B4BC;--ink3:#8A8A93;--line:#26262A;--card:#161618;--card2:#1E1E21;--glass:#161618;--glassb:rgba(255,255,255,.06);
 --blue:#8FB8A8;--blue-d:#B5D3C7;--blue-l:#1C2622;--blue-ll:#141A17;--rosa:#2A1F24;--rosa-l:#1E181B;--rosa-d:#E2A3BC;--grad:#8FB8A8;--shadow:rgba(0,0,0,.4);--ac:#8FB8A8;--ok:#8FB8A8}
html,body{background:var(--bg)!important}
.blobs,.tabfade{display:none!important}
header{background:var(--bg)!important;padding:calc(var(--top) + 14px) 20px 6px!important}
.hrow{background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#who,[data-cid=who],#art,[data-cid=art]{display:none!important}
#title:empty,[data-cid=title]:empty{display:none}
#gear,[data-cid=gear]{margin-left:auto;background:none!important;box-shadow:none!important;color:var(--ink3)!important}
main{padding:2px 14px calc(var(--bot) + 110px)!important}
/* Leiste unten */
.tabs{left:0!important;right:0!important;bottom:0!important;transform:none!important;width:auto!important;display:flex!important;justify-content:space-around!important;align-items:flex-start!important;gap:0!important;
 padding:8px 4px calc(var(--bot) + 6px)!important;border-radius:0!important;background:var(--bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;border-top:1px solid var(--line)!important}
.tabs .tind{display:none!important}
.tabs{z-index:35!important}
html.dark .tabs,html .tabs{background:var(--bg)!important;box-shadow:none!important;border-top:1px solid var(--line)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.tabs button{flex:1;width:auto!important;height:auto!important;min-width:0!important;padding:4px 0!important;display:flex!important;flex-direction:column;align-items:center;gap:4px;font-size:11px!important;font-weight:600;color:var(--ink3)!important;background:none!important;box-shadow:none!important;transition:transform .12s,opacity .12s}
.tabs button.on{color:var(--ac)!important}
.tabs button:active{transform:scale(.96)!important;opacity:.75}
.tabs svg.ti{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* Unterteilung Essen (und gleicher Stil für andere Umschalter) */
.useg{display:flex;gap:24px;padding:4px 4px 6px}
.useg button{border:0;background:none;padding:0 0 5px;font-size:17px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer}
.useg button.on{color:var(--ink);border-bottom-color:var(--ac)}
/* Knöpfe: flach, Akzent mit dunkler Schrift */
.btn.p,.btn.grad,.ib.p{background:var(--ac)!important;background-image:none!important;color:#0B0B0C!important;box-shadow:none!important}
.btn.s{background:var(--card2)!important;color:var(--ink)!important;box-shadow:none!important}
.btn,.ib{box-shadow:none!important}
.day,.rectop,.weekcard,.rephero,.fsec,.setcard,.infocard,.rcard,.donebox,.pcta,.item{box-shadow:none!important;background-image:none!important}
.sheet{background:#141416!important}
/* Neue Seiten */
.pg{padding:6px 6px 0}
.pg .dt{color:var(--ink3);font-size:15px}
.pg .hello{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:2px 0 30px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.sh .st{font-size:18px;font-weight:650}.sh span+span{font-size:14px;color:var(--ink3)}
.ln{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 4px;margin-bottom:30px}
.ln.tap{padding:14px 4px 12px}
.lr{display:flex;gap:14px;align-items:center;padding:13px 0;font-size:15.5px;min-height:24px}
.lr+.lr{border-top:1px solid var(--line)}
.lr .tx{flex:1;min-width:0}
.lr .n{margin-left:auto;color:var(--ink3);font-size:14px;white-space:nowrap}
.lr input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15.5px;color:var(--ink);padding:0}
.lr input::placeholder{color:var(--ink3)}
.lr.done .tx{color:var(--ink3);text-decoration:line-through}
.lr .add{color:var(--ink3)}
.tap{cursor:pointer}
.ckb{width:22px;height:22px;border-radius:50%;border:1.5px solid #5A5A63;flex:none;background:none;padding:0;cursor:pointer;transition:background .15s,border-color .15s}
.ckb.x{background:var(--ac);border-color:var(--ac)}
.ckb.ghost{border-style:dashed;border-color:#3A3A40}
.wk{display:flex;gap:6px;margin-left:auto}.wk i{width:9px;height:9px;border-radius:50%;background:var(--line)}.wk i.y{background:var(--ac)}
.tl{height:8px;border-radius:4px;background:var(--line);position:relative}.tl i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--ac)}
.ax{position:relative;height:16px;margin-top:8px;font-size:12.5px;color:var(--ink3)}.ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.soon{color:var(--ink3);font-size:15.5px;line-height:1.5;margin:10px 4px}
.form{display:flex;flex-direction:column;gap:14px;padding:4px 0 10px}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15.5px}
.fl .inp{max-width:60%}
/* ===== Schritt 2: Essen und Nährstoffe im neuen Stil ===== */
html.dark{--lv-low:#D08C8C;--lv-ok:#8A8A93;--lv-good:#8FB8A8;--lv-high:#D9A66B}
html.dark .btn{border-radius:12px!important}
html.dark .field,html.dark .inp{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important;color:var(--ink)!important}
/* Umschalter wie oben: Text mit Unterstrich */
html.dark .seg{background:none!important;box-shadow:none!important;border:0!important;padding:0!important;gap:22px!important;justify-content:flex-start!important;width:auto!important}
html.dark .seg .segi{display:none!important}
html.dark .seg button,html.dark .seg>button{flex:none!important;width:auto!important;background:none!important;background-image:none!important;box-shadow:none!important;color:var(--ink3)!important;padding:0 0 5px!important;border-radius:0!important;border-bottom:2px solid transparent!important;font-size:15px!important}
html.dark .seg button.on,html.dark .seg>button.on{color:var(--ink)!important;border-bottom-color:var(--ac)!important}
/* Woche: Zeilen mit Linien */
html.dark .week{gap:0!important;border-top:1px solid var(--line)}
html.dark .day,html.dark .day.today,html.dark .day:not(.today){background:none!important;background-image:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;outline:0!important;margin:0!important;padding:14px 4px!important;min-height:0!important}
html.dark .day .dlabel,html.dark .day.today .dlabel,html.dark .day:not(.today) .dlabel{background:none!important;background-image:none!important;box-shadow:none!important;border:0!important;width:38px!important;height:auto!important}
html.dark .day .dlabel .wd{color:var(--ink3)!important;font-size:12.5px!important}
html.dark .day .dlabel .dn{color:var(--ink)!important;font-size:19px!important;font-weight:650}
html.dark .day.today .dlabel .wd,html.dark .day.today .dlabel .dn{color:var(--ac)!important}
html.dark .day .empty,html.dark .day.today .empty,html.dark .day:not(.today) .empty{color:var(--ink3)!important}
html.dark .day .ib.p,html.dark .day:not(.today) .ib.p{background:none!important;background-image:none!important;color:var(--ink3)!important;box-shadow:none!important;border:1px solid var(--line)!important}
html.dark .chip{background:none!important;background-image:none!important;box-shadow:none!important;border:0!important;padding:2px 0!important}
html.dark .chip .m{background:var(--card2)!important;color:var(--ink2)!important}
/* Einkaufsliste */
html.dark .item{background:none!important;background-image:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;margin:0!important}
html.dark .flatlist{border-top:1px solid var(--line);gap:0!important}
html.dark .item.gap{margin-top:0!important}
html.dark .item .cb{border-color:#5A5A63!important;background:none!important}
html.dark .donebox{background:none!important;border:0!important;border-radius:0!important}
/* Rezepte: Kacheln als ruhige Auswahl */
html.dark .tiles{display:flex!important;flex-wrap:wrap!important;gap:8px!important;overflow:visible!important;grid-template-columns:none!important}
html.dark .tile{background:var(--card)!important;background-image:none!important;color:var(--ink)!important;box-shadow:none!important;border:1px solid var(--line)!important;border-radius:10px!important;width:auto!important;height:auto!important;min-height:0!important;padding:9px 12px!important;grid-column:auto!important;grid-row:auto!important;flex:none!important;display:inline-flex!important;align-items:center!important;gap:8px!important;font-size:14px!important}
html.dark .tile::after{display:none!important}
html.dark .tile .tcount,html.dark .tile span{position:static!important;background:none!important;color:var(--ink3)!important;font-size:13px!important;width:auto!important;height:auto!important;box-shadow:none!important}
html.dark .tile span:first-child{color:var(--ink)!important;font-size:14px!important;font-weight:550}
html.dark .tile.on{border-color:var(--ac)!important;background:var(--blue-l)!important}
html.dark .rcard{background:none!important;background-image:none!important;box-shadow:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important}
/* Nährstoffe */
html.dark .nutpage,html.dark .nuthero,html.dark .infocard,html.dark .nutpage .infocard{background:none!important;background-image:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
html.dark .nutpage .infocard{border-top:1px solid var(--line)!important}
html.dark .jar,html.dark .nuthero,html.dark .nutpage{--jc:var(--card)!important;--j1:var(--ac)!important;--j2:var(--ac)!important;--jg:var(--ac)!important}
html.dark .jar.low,html.dark .nuthero.low,html.dark .nutpage.low{--j1:var(--lv-low)!important;--j2:var(--lv-low)!important;--jg:var(--lv-low)!important}
html.dark .jar.high,html.dark .nuthero.high,html.dark .nutpage.high{--j1:var(--lv-high)!important;--j2:var(--lv-high)!important;--jg:var(--lv-high)!important}
html.dark .rep .rbar i{background:var(--lv-ok)!important}
html.dark .rep.low .rbar i{background:var(--lv-low)!important}
html.dark .rep.good .rbar i{background:var(--lv-good)!important}
html.dark .rep.high .rbar i{background:var(--lv-high)!important}
html.dark .legend .lg.low i{background:var(--lv-low)!important}html.dark .legend .lg.ok i{background:var(--lv-ok)!important}
html.dark .legend .lg.good i{background:var(--lv-good)!important}html.dark .legend .lg.high i{background:var(--lv-high)!important}
html.dark .nutpage .pill,html.dark .nutpage .pill.t,html.dark .pill,html.dark .pill.t{background:var(--card2)!important;background-image:none!important;color:var(--ink2)!important;box-shadow:none!important}
/* Schritt 2b: Nährstoff-Seite und Rest */
html.dark .weekcard,html.dark .rephero,html.dark .rectop,html.dark .fsec,html.dark .calbar+.row .seg{background:none!important;background-image:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
html.dark .weekcard,html.dark .rephero{border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;padding-left:4px!important;padding-right:4px!important}
html.dark .rephero::before{display:none!important}
html.dark .weekcard .dj,html.dark .weekcard .dj.today{--dh:#8A8A93;background:none!important;background-image:none!important;box-shadow:inset 0 0 0 1px var(--line)!important}
html.dark .weekcard .dj .djl{color:var(--ink2)!important;font-weight:600}
html.dark .weekcard .dj.sel{box-shadow:inset 0 0 0 1.5px var(--ac)!important}
html.dark .weekcard .dj.today .djl{color:var(--ac)!important}
html.dark .weekcard .dj .jfill{background:var(--ac)!important;opacity:.25}
html.dark .ph2ring{background:none!important}
html.dark .ph2pct{background:none!important;-webkit-text-fill-color:var(--ink)!important;color:var(--ink)!important}
html.dark .ph2ring circle:last-of-type,html.dark .ringarc{stroke:var(--ac)!important}
html.dark .macbar{background:var(--line)!important;box-shadow:none!important}
html.dark .mac i{background:var(--ac)!important}
html.dark .tile{flex-direction:row!important;white-space:nowrap!important}
html.dark .ph2ring circle:first-of-type{stroke:var(--line)!important}
/* Statistik neu */
.pg>.useg{margin:0 0 26px;padding-left:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding:14px 0 2px}
.bars.thin{gap:3px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--ink3)}
.bars span{height:14px;line-height:14px}
.bars b{width:100%;border-radius:3px;background:var(--ac);display:block}
.sub{font-size:14px;color:var(--ink3);margin:0 4px 6px}
.ln+.sub{margin-top:-12px}
.mb{flex:none;width:84px;height:6px;border-radius:3px;background:var(--line);position:relative;margin-left:12px}
.mb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--lv-ok)}
.mb.low i{background:var(--lv-low)}.mb.good i{background:var(--lv-good)}.mb.high i{background:var(--lv-high)}
.lr .n+.mb{margin-left:12px}
/* ===== Schritt 3: Mittelding, weiche Karten, Farbe je Bereich, einheitlicher Kopf ===== */
html.dark{--card:#18181B;--card2:#222226;--sep:#26262B;--c-sleep:#9AA5FF;--c-todo:#F2A877;--c-goal:#E6C170;--c-food:#8FB8A8;
 --cardbg:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 46px),var(--card);--cardsh:0 10px 26px -14px rgba(0,0,0,.7)}
/* Kopf: auf jeder Seite gleich */
header{padding:calc(var(--top) + 16px) 20px 4px!important}
.hrow{min-height:46px;padding:0!important}
#title,[data-cid=title]{display:block!important;font-size:32px!important;font-weight:700!important;letter-spacing:-.025em;line-height:1.15;padding-left:4px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.useg{padding:12px 4px 2px!important;gap:24px}
.pg{padding:14px 6px 0!important}
.pg>.dt{margin:-6px 4px 22px;color:var(--ink3);font-size:15px}
/* Karten statt Linien */
.ln{background:var(--cardbg);border:0!important;border-radius:22px;padding:2px 16px;margin-bottom:30px;box-shadow:var(--cardsh)}
.ln.pad{padding:16px 16px 14px}
.lr+.lr{border-top:1px solid var(--sep)!important}
.sh{margin:0 6px 10px!important}
.lr .plus{width:22px;text-align:center;color:var(--ink3);font-size:21px;line-height:1;flex:none}
.ln.todo .ckb.x{background:var(--c-todo);border-color:var(--c-todo)}
.ln.todo .ckb{border-color:color-mix(in srgb,var(--c-todo) 55%,#3A3A40)}
.lr.goal .ckb,.ln.goals .ckb{border-color:color-mix(in srgb,var(--c-goal) 55%,#3A3A40)}
.lr.goal .ckb.x,.ln.goals .ckb.x{background:var(--c-goal);border-color:var(--c-goal)}
.lr.goal .wk i.y,.ln.goals .wk i.y{background:var(--c-goal)}
.mb.goal i{background:var(--c-goal)!important}
.sleep .tl i,.sleep .bars b{background:linear-gradient(180deg,color-mix(in srgb,var(--c-sleep) 80%,#fff),var(--c-sleep))!important}
.sleep .tl{background:color-mix(in srgb,var(--c-sleep) 14%,var(--card2))}
.rp{width:22px;height:22px;flex:none;color:var(--c-todo)}.rp svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
