<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#2A2B2E;font-family:Inter,sans-serif;color:#F2F2F4;-webkit-font-smoothing:antialiased;width:1290px}
.cap{font:600 15px Inter;color:#C9CBD1;margin:0 0 12px 4px}
.row{display:flex;gap:40px;align-items:flex-start}
.ph{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#0B0B0C;--ln:#26262A;--ac:#8FB8A8;--mu:#8E8E96;flex:none}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;font-weight:600;font-size:15px}
.in{padding:18px 20px 0}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font-size:18px;font-weight:650}.h span{font-size:14px;font-weight:500;color:var(--mu)}
.g{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:0 4px;margin-bottom:24px}
.r{display:flex;align-items:center;padding:12px 0;font-size:15.5px}.r+.r{border-top:1px solid var(--ln)}.n{margin-left:auto;color:var(--mu);font-size:14px}
.seg{display:flex;gap:22px;font-size:15px;color:var(--mu);margin:0 4px 26px}.seg .on{color:#F2F2F4;border-bottom:2px solid var(--ac);padding-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:90px;padding:12px 0 4px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--mu)}.bars b{width:100%;border-radius:3px;background:var(--ac);display:block}
.mb{height:6px;border-radius:3px;background:var(--ln);width:90px;margin-left:12px;position:relative}.mb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ac)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;padding-bottom:20px;background:#0B0B0C;border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;font-size:11px;font-weight:600;color:#7A7A83}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:4px}.tabs .on{color:var(--ac)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.logos{display:grid;grid-template-columns:repeat(4,180px);gap:28px 20px}
.lg{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#C9CBD1}
.ic{width:120px;height:120px;border-radius:27px;display:flex;align-items:center;justify-content:center}
.ic svg{width:120px;height:120px}
.dk{background:linear-gradient(180deg,#1E1F22,#0B0B0C)}.lt{background:linear-gradient(180deg,#FFFFFF,#EEF2F0)}
</style></head><body>
<script>
const I={
Start:'<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
Essen:'<path d="M7 4v7m-2-7v4a2 2 0 0 0 4 0V4M7 11v9M16.5 4c-1.8 0-3 2.2-3 5 0 2 1.2 3 3 3v8"/>',
'To-dos':'<path d="m4.5 7 1.8 1.8L9.5 5.5M4.5 15.5l1.8 1.8 3.2-3.3M13 7.5h7M13 16h7"/>',
Statistik:'<path d="M5 20V13M10 20V8M15 20v-6M20 20V5"/>',
Neues:'<path d="M5 5h11v14H6a1 1 0 0 1-1-1zM16 9h3v9a1 1 0 0 1-2 0M8 9h5M8 12.5h5M8 16h3"/>'};
const tabs=o=>`<div class="tabs">${Object.keys(I).map(t=>`<span class="${t==o?'on':''}"><svg viewBox="0 0 24 24">${I[t]}</svg>${t}</span>`).join('')}</div>`;
const A='#8FB8A8';
const L=[
['Haken im Kreis',c=>`<circle cx="60" cy="60" r="30" fill="none" stroke="${A}" stroke-width="7"/><path d="m47 61 9 9 18-19" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`],
['Tag und Nacht',(c,k)=>`<mask id="m${k}"><rect width="120" height="120" fill="#fff"/><circle cx="74" cy="50" r="24" fill="#000"/></mask><circle cx="58" cy="62" r="30" fill="${A}" mask="url(#m${k})"/><circle cx="82" cy="40" r="6" fill="${c}"/>`],
['Drei Linien',c=>`<rect x="34" y="40" width="52" height="7" rx="3.5" fill="${c}"/><rect x="34" y="57" width="36" height="7" rx="3.5" fill="${A}"/><rect x="34" y="74" width="44" height="7" rx="3.5" fill="${c}"/>`],
['j und f',c=>`<text x="60" y="78" text-anchor="middle" font-family="Inter" font-weight="700" font-size="56" letter-spacing="-3" fill="${c}">j<tspan fill="${A}">f</tspan></text>`]];
const sleep=[[78,'Fr'],[60,'Sa'],[85,'So'],[70,'Mo'],[74,'Di'],[66,'Mi'],[80,'Do']];
const nut=[['Kalorien',92],['Eiweiß',81],['Ballaststoffe',64],['Eisen',58],['Vitamin D',22],['Calcium',71]];
document.write(`<div class="row">
<div><div class="cap">Statistik ohne Überschrift, Symbole unten</div><div class="ph"><div class="sb"><span>9:41</span><span>5G</span></div><div class="in">
<div class="seg"><span class="on">Woche</span><span>Monat</span><span>Jahr</span></div>
<div class="h">Schlaf<span>im Schnitt 7 h 05 min</span></div><div class="g" style="padding-bottom:6px"><div class="bars">${sleep.map(([h,d])=>`<div><b style="height:${h*.7}px"></b>${d}</div>`).join('')}</div></div>
<div class="h">Ziele<span>71 % geschafft</span></div><div class="g"><div class="r">10 Seiten lesen<span class="n">4 von 7</span></div><div class="r">2 Liter trinken<span class="n">6 von 7</span></div></div>
<div class="h">Nährstoffe<span>Schnitt vom Bedarf</span></div><div class="g">${nut.map(([n,p])=>`<div class="r">${n}<span class="n">${p} %</span><span class="mb"><i style="width:${p}%"></i></span></div>`).join('')}</div>
</div>${tabs('Statistik')}</div></div>
<div><div class="cap">Logo-Ideen, dunkel und hell</div><div class="logos">
${L.map(([n,f])=>`<div class="lg"><div class="ic dk"><svg viewBox="0 0 120 120">${f('#F2F2F4','d')}</svg></div>${n}</div>`).join('')}
${L.map(([n,f])=>`<div class="lg"><div class="ic lt"><svg viewBox="0 0 120 120">${f('#1A1B1E','l')}</svg></div></div>`).join('')}
</div></div></div>`);
</script></body></html>
